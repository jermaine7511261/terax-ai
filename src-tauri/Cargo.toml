[package]
name = "yamet"
version = "0.1.14"
description = "Yamet — an open-source AI-native terminal emulator"
authors = ["Yamet contributors"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Enables the devtools toggle command's webview devtools path (tauri gates the
# webview devtools methods behind this feature / debug_assertions).
devtools = []

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yamet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
dirs = "6"
log = "0.4"
ignore = "0.4"
regex = "1"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
globset = "0.4"
nucleo-matcher = "0.3"
shared_child = "1"
tauri-plugin-log = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
reqwest = { version = "0.12", default-features = false, features = [
	"rustls-tls",
	"stream",
	"blocking",
	"json",
] }
bytes = "1"
futures-util = "0.3"
tokio = { version = "1", default-features = false, features = [
	"rt",
	"net",
	"time",
	"macros",
	"sync",
	"io-util",
	"fs",
	"process",
] }
tempfile = "3"
notify = "8.2.0"
which = "8.0.4"
tokio-tungstenite = { version = "0.24", default-features = false, features = [
	"rustls-tls-webpki-roots",
	"connect",
] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
cfb8 = "0.8"
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
rand = "0.8"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
url = "2"
hex = "0.4"
chrono = { version = "0.4", features = ["clock", "serde"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
tauri = { version = "2", features = ["test"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = [
	"apple-native",
] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSUserDefaults"] }

# WebKitGTK can't read external clipboard copies; mac/win webviews can.
[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-clipboard-manager = "2"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = [
	"windows-native",
] }
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_Security_Cryptography",
	"Win32_System_Console",
	"Win32_System_JobObjects",
	"Win32_System_ProcessStatus",
	"Win32_System_Threading",
	"Win32_System_Diagnostics_ToolHelp",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = true
